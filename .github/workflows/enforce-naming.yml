name: Enforce Naming Convention

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - edited
      - synchronized

jobs:
  check-title:
    runs-on: ubuntu-latest
    # This step only runs on Pull Requests, so it won't crash on a regular push
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            test
          requireScope: false

  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # This allows main and develop to pass, but checks all other branches
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" ]]; then
            echo "Branch $BRANCH_NAME is protected; skipping check."
          elif [[ ! "$BRANCH_NAME" =~ ^(feat|fix|chore|docs)/.* ]]; then
            echo "Error: Branch name '$BRANCH_NAME' must start with feat/, fix/, chore/, or docs/"
            exit 1
          fi