name: Enforce Naming Convention

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  check-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            test
            merge
          requireScope: false

  check-commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Messages
        run: |
          PATTERN="^(feat|fix|chore|docs|style|refactor|test)(\(.+\))?: .+"
          INVALID=0

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMITS=$(git log --format="%s" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            COMMITS=$(git log --format="%s" -1)
          fi

          while IFS= read -r MSG; do
            if [ -z "$MSG" ]; then
              continue
            fi
            if ! echo "$MSG" | grep -qP "$PATTERN"; then
              echo "Invalid commit message: '$MSG'"
              echo "Expected format: type: description (e.g. feat: add login page)"
              INVALID=1
            else
              echo "Valid commit message: '$MSG'"
            fi
          done <<< "$COMMITS"

          if [ "$INVALID" -eq 1 ]; then
            exit 1
          fi
