name: Enforce Naming Convention

on:
  push:
    # Using '**' tells GitHub to run this on every branch push
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - edited
      - synchronized

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            test
          requireScope: false

  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name
        run: |
          if [[ ! ${{ github.head_ref }} =~ ^(feat|fix|chore|docs)/.* ]]; then
            echo "Error: Branch name must start with feat/, fix/, chore/, or docs/"
            exit 1
          fi